
<section class="study-shell word-collect-page">
	<div ng-include="'./includes/studyHeader.html'"
		ng-init="studyEyebrow='VOCABULARY LAB'; studyTitle='Word Collection'; studyDescription='Browse, listen to and save useful vocabulary by topic.'; studyStatus='VOCABULARY'"></div>

	<div class="word-collect-toolbar">
		<label class="word-search">
			<i class="fa fa-search" aria-hidden="true"></i>
			<input type="search" ng-model="wordSearch" ng-change="wordPage=0" placeholder="Search words or meanings..." aria-label="Search words or meanings">
		</label>
		<div class="word-collect-actions">
			<button type="button" class="btn btn-sm btn-outline-secondary" ng-click="toggleAll()" ng-attr-aria-label="{{allCategoriesOpen ? 'Close all topics' : 'Open all topics'}}">
				<i class="fa" ng-class="allCategoriesOpen ? 'fa-angle-double-up' : 'fa-angle-double-down'" aria-hidden="true"></i>
				{{allCategoriesOpen ? 'Close all' : 'Open all'}}
			</button>
			<a class="btn btn-sm btn-quiz" ng-href="#!quiz">
				<i class="fa fa-bolt" aria-hidden="true"></i> Quiz
			</a>
		</div>
	</div>

	<div class="word-collect-summary">
		<span><strong>{{storyTitles.length}}</strong> topics</span>
		<span><strong>{{totalWords}}</strong> words</span>
		<span ng-if="wordSearch">Filtering: <strong>{{wordSearch}}</strong></span>
	</div>

	<div ng-repeat="category in storyTitles track by $index" class="word-category" id="wcat-{{$index}}">
		<h6 class="accordion">
			<a href ng-click="acc_click($index)" ng-class="{'is-open': acc_isShow($index)}">
				<span class="category-number">{{$index + 1}}</span>
				<span>{{category.title}}</span>
				<small>{{category.num}} words</small>
				<i class="fa" ng-class="acc_isShow($index) ? 'fa-chevron-up' : 'fa-chevron-down'" aria-hidden="true"></i>
			</a>
		</h6>

		<div class="accordion-content word-category-content" ng-if="acc_isShow($index)">
			<div class="track-pager-bar" ng-show="wordPageCount(category) > 1">
				<button type="button" class="track-page-btn" ng-click="wordPrevPage(category)" aria-label="Previous page">
					<i class="fa fa-chevron-left" aria-hidden="true"></i>
				</button>
				<span class="track-page-info">{{wordPage + 1}} / {{wordPageCount(category)}}</span>
				<button type="button" class="track-page-btn" ng-click="wordNextPage(category)" aria-label="Next page">
					<i class="fa fa-chevron-right" aria-hidden="true"></i>
				</button>
			</div>
			<div ng-repeat="word in filteredWords(category) | limitTo:wordPageSize:(wordPage*wordPageSize) track by $index" class="word-row">
				<span class="word-idx">{{wordPage*wordPageSize + $index + 1}}</span>
				<button type="button" class="btn btn-sm btn-primary vocaNoteBtn word-row-action" ng-show="!IsWordSavedBefore(word.full)" ng-click="saveNoted(word.full)" title="Save word" aria-label="Save word"><i class="fa fa-bookmark" aria-hidden="true"></i></button>
				<span compile="word.p1" ng-click="wordClick($event, word)" class="word-text word-text-main"></span>
				<span compile="word.p2" ng-click="showExampleModal(word.full, $event)" class="word-text word-text-detail"></span>
				<div class="word-examples" ng-if="exSent[wordHead(word.full)] && wordHead(word.full) === openExHead">
					<div class="word-examples-loading" ng-if="exSent[wordHead(word.full)].loading">
						<i class="fa fa-spinner fa-spin" aria-hidden="true"></i> Loading examples...
					</div>
					<div class="example-sentence" ng-repeat="s in exSent[wordHead(word.full)].list track by $index"
						ng-click="speakSentence($event, s)" role="button" tabindex="0" title="Tap to listen">
						<span class="example-number">{{$index + 1}}</span>
						<span ng-bind-html="s"></span>
						<i class="fa fa-volume-up example-sentence-icon" aria-hidden="true"></i>
					</div>
					<div class="word-examples-empty" ng-if="!exSent[wordHead(word.full)].loading && !exSent[wordHead(word.full)].list.length">
						No examples found.
					</div>
				</div>
			</div>
			<p class="word-empty" ng-if="!filteredWords(category).length">No matching words.</p>
		</div>
	</div>
</section>
