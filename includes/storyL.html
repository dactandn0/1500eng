
<div class="track-pager my-1 mb-4" ng-controller="trackPagerCtrl">
	<div class="track-pager-bar" ng-show="pageCount() > 1">
		<button type="button" class="track-page-btn" ng-click="prevPage()" aria-label="Previous page">
			<i class="fa fa-chevron-left" aria-hidden="true"></i>
		</button>
		<span class="track-page-info">{{trackPage + 1}} / {{pageCount()}}</span>
		<button type="button" class="track-page-btn" ng-click="nextPage()" aria-label="Next page">
			<i class="fa fa-chevron-right" aria-hidden="true"></i>
		</button>
	</div>
	<div class="track-list">
		<a ng-repeat="title in titles | limitTo:pageSize:(trackPage*pageSize) track by $index"
		ng-click="goTrack(trackPage*pageSize + $index);"
		ng-class="storyIdx===(trackPage*pageSize + $index) ? 'font-weight-bold is-active' : 'font-weight-normal'"
		href="" class="track-item p-2 mr-1">
			<span ng-style="title.ngStyle">
				{{title.trackRutgon || title.track || (trackPage*pageSize + $index)}}
			</span>
		</a>
	</div>
</div>

<div ng-include="'./includes/audioLoopRadio.html'" ng-controller="audioLoopRadioCtrl" class="mb-1"></div>
<div ng-include="'./includes/audio.html'" ng-controller="AudioCtrl"></div>

<div class="lesson-panel card mt-2" ng-init="showLession=1;showScript=1">
	<div class="card-body">
	  <div class="card-text my-2">
	  	
	  	<h6 class="accordion toggleClick" ng-click="showLession=!showLession">
		    <a href>{{story.fTitle}}</a>
		    <span ng-if="story.hasExercise" class="text-danger">[Ex.]</span>
		</h6>
		 
	  	<div class="accordion-content toggleShow" ng-show="showLession">
			<button type="button" class="script-toggle" ng-click="showScript=!showScript">
			<i class="fa" ng-class="showScript ? 'fa-eye-slash' : 'fa-eye'" aria-hidden="true"></i>
			{{!showScript ? 'Show script' : 'Hide script'}}
		</button>
	  	 	<div ng-show="showScript">
	  			<p id="content-to-word" title="{{story.fTitle}}" compile="story.enShow" ng-if="!$root.bShowVi"></p>
	  			<p compile="story.viShow" ng-if="$root.bShowVi"></p>
	  	 	</div>

		  	<div ng-include="'./includes/exercise.html'" ></div>
			<div ng-include="'./includes/html_note.html'" ></div>
	  	</div>

	  </div> <!-- card-text -->
	</div> 		<!-- card-body -->
</div> <!-- card -->
