        <div class="app-search input-group">
        <input type="text"
          id="searchTyping"
          class="form-control app-search-input"
          ng-change="searchTyping()" 
          ng-model="search" 
          placeholder="Search..."
          > 

        <div class="input-group-append">
          <button class="btn btn-sm search-action search-action-speak"
            ng-click="Index_Speak($event, search)">
           <i class="fa fa-volume-up" aria-hidden="true"></i><span class="sr-only">Speak</span></button>
         </div> 

        <div class="input-group-append">
          <button class="btn btn-sm search-action search-action-save"
            ng-click="saveNoted(search)">
           <i class="fa fa-bookmark" aria-hidden="true"></i><span class="sr-only">Save word</span></button>
         </div> 

        <div class="input-group-append">
          <button class="btn btn-sm search-action search-action-sentence search-action-text"
            ng-click="fetchSentenceSearch()" title="Find example sentences" aria-label="Find example sentences">
          <i class="fa fa-comment-o" aria-hidden="true"></i><span>Ex</span></button>
        </div>
        
        <div class="input-group-append">
          <button class="btn btn-sm search-action search-action-clear"
            ng-click="clearSearch()">
          <i class="fa fa-times" aria-hidden="true"></i><span class="sr-only">Clear search</span></button>
        </div>
       </div> <!-- form-search -->

      <section class="example-results" ng-if="sentenceSearches.length">
        <div class="example-results-heading">
          <span><i class="fa fa-comments-o" aria-hidden="true"></i> Example sentences</span>
          <small>Click a sentence to listen</small>
        </div>
        <div class="example-sentence"
          ng-repeat="sen in sentenceSearches | limitTo:-3 track by $index"
          ng-click="Index_Speak($event, sen, true)"
          tabindex="0"
          role="button">
          <span class="example-number">{{$index + 1}}</span>
          <span ng-bind-html="sen"></span>
          <i class="fa fa-volume-up example-sentence-icon" aria-hidden="true"></i>
        </div>
      </section>

      <section class="vocabulary-results" ng-if="searchDataResult.length">
        <div class="vocabulary-results-heading">
          <span><i class="fa fa-book" aria-hidden="true"></i> Matching vocabulary</span>
          <small>{{searchDataResult.length}} results</small>
        </div>
        <div class="vocabulary-row" ng-repeat="word in searchDataResult track by $index">
          <button type="button" class="vocabulary-action vocabulary-save vocaNoteBtn"
            ng-if="!IsWordSavedBefore(word)"
            ng-click="saveNoted(word)"
            title="Save word" aria-label="Save word">
            <i class="fa fa-bookmark" aria-hidden="true"></i>
          </button>
          <button type="button" class="vocabulary-action vocabulary-example"
            ng-click="showExampleModal(word, $event)"
            title="Show examples" aria-label="Show examples">
            <i class="fa fa-comment-o" aria-hidden="true"></i><span>Ex</span>
          </button>
          <span class="vocabulary-word" ng-click="Index_Speak($event, word)">{{word}}</span>
        </div>
      </section>
      
      <div ng-include="'./includes/showVi.html'" ></div>
      <div ng-include="'./includes/vocaOfEbook.html'" ></div>
      <div ng-show="!$root.bVocaOfEbook">
        <div class="my-3" ng-view></div>
      </div>
