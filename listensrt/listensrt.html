<section class="study-shell quiz-page">
	<div ng-include="'./includes/studyHeader.html'"
		ng-init="studyEyebrow='LISTENING LAB'; studyTitle='Listen with Subtitle'; studyDescription='Xem video/Audio, phụ đề chạy theo, chạm dòng để nhảy tới.'; studyStatus='TRY HARD'"></div>

	<style>
		.watch-video-wrap { background:#000; border-radius:12px; overflow:hidden; margin-bottom:.8rem; }
		.watch-video-wrap video { width:100%; max-height:52vh; display:block; background:#000; }
		.watch-yt-wrap { position:relative; width:100%; padding-bottom:56.25%; background:#000; border-radius:12px; overflow:hidden; margin-bottom:.8rem; }
		.watch-yt-wrap #watchYt { position:absolute; inset:0; }
		.watch-yt-wrap #watchYt iframe { width:100%; height:100%; }
		.watch-row { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.8rem; align-items:center; }
		.watch-subs { max-height:46vh; overflow-y:auto; padding:.4rem; background:#fffdf7; border:1px solid #eee5c9; border-radius:12px; -webkit-overflow-scrolling:touch; }
		.watch-sub { padding:.55rem .7rem; border-radius:10px; border:1px solid transparent; }
		.watch-sub.is-active { background:#fff0b8; border-color:#e6c96c; }
		.watch-sub-en { font-size:.95rem; color:#3d4c59; cursor:pointer; }
		.watch-sub.is-active .watch-sub-en { color:#5f470c; font-weight:700; }
		.watch-sub-vi { font-size:.82rem; color:#8b857b; margin-top:.15rem; }
		.watch-sub-meta { display:flex; align-items:center; gap:.5rem; margin-top:.25rem; }
		.watch-time { font-size:.72rem; color:#23639a; background:#edf6ff; border:1px solid #cfe3f6; border-radius:999px; padding:.1rem .5rem; }
		.watch-toggle { padding:.4rem .7rem; border-radius:999px; border:1px solid #eee5c9; background:#fffdf7; color:#756d61; font-size:.8rem; }
		.watch-toggle.is-on { background:linear-gradient(135deg,#fff4c9 0%,#ffe9a2 100%); border-color:#e6c96c; color:#604a0e; }
		.quiz-speak.is-on { background:#e7f7ee !important; border-color:#bfe6cf !important; color:#1e7e46 !important; }
		.lesson-drop { position:absolute; top:100%; left:0; right:0; z-index:50; max-height:240px; overflow-y:auto;
			background:#fffdf7; border:1px solid #eee5c9; border-radius:10px; margin-top:.25rem;
			box-shadow:0 8px 20px rgba(191,151,45,.18); -webkit-overflow-scrolling:touch; }
		.lesson-drop-item { padding:.55rem .8rem; font-size:.9rem; color:#3d4c59; cursor:pointer; }
		.lesson-drop-item.is-active { background:#fff0b8; color:#5f470c; font-weight:700; }
		.lesson-drop-item.is-empty { color:#8b857b; font-style:italic; cursor:default; }
	</style>

	<div class="quiz-type-row my-2">
		<div style="flex:1; position:relative;">
			<input class="setting-select" style="width:100%;" ng-model="lessonSearch"
				ng-focus="lessonDropOpen = true" ng-blur="closeLessonDrop()" ng-change="lessonDropOpen = true"
				ng-click="selectAllLesson($event)"
				placeholder="Tìm bài..." aria-label="Tim bai" autocomplete="off">
			<div class="lesson-drop" ng-show="lessonDropOpen">
				<div class="lesson-drop-item" ng-class="{'is-active': c.i === lessonIdx}"
					ng-repeat="c in lessonChoices | filter:lessonSearch track by $index"
					ng-mousedown="pickLesson(c)">{{c.title}}</div>
				<div class="lesson-drop-item is-empty" ng-if="!(lessonChoices | filter:lessonSearch).length">Không thấy bài nào</div>
			</div>
		</div>
	</div>

	<div ng-if="!lesson">
		<p style="color:#8b857b;">Chưa có bài nào. Thêm vào <code>LISTEN_DATA</code> trong <code>listensrt/listensrtData.js</code> (dùng <code>listensrt/srt2js.py</code> để chuyển .srt).</p>
	</div>

	<div ng-if="lesson">
		<div class="watch-video-wrap" ng-if="lesson.type !== 'youtube' && !isAudio">
			<video id="watchVideo" controls playsinline preload="metadata"></video>
		</div>
		<div class="watch-video-wrap" ng-if="lesson.type !== 'youtube' && isAudio" style="background:#fffdf7;">
			<audio id="watchAudio" controls preload="metadata" style="width:100%;"></audio>
		</div>
		<div class="quiz-feedback is-bad" ng-if="videoErr">{{videoErr}}</div>
		<div class="watch-yt-wrap" ng-if="lesson.type === 'youtube'">
			<div id="watchYt"></div>
		</div>

		<div class="watch-row">
			<button type="button" class="watch-toggle" ng-class="{'is-on': follow}" ng-click="follow = !follow">
				<i class="fa fa-magnet" aria-hidden="true"></i> Cuộn theo
			</button>

			<span class="watch-time">Loop Delay <input type="number" ng-model="loopDelay" ng-change="setLoopDelay()"
				min="0" max="10000" step="50" style="width:64px; border:none; background:transparent; text-align:center;" aria-label="Loop delay ms"> ms</span>
		</div>

		<div class="watch-subs">
			<div class="watch-sub" id="wsub{{$index}}" ng-class="{'is-active': $index === curIdx}"
				ng-repeat="sub in lesson.subs track by $index" ng-click="seekSub(sub, $event)" role="button" tabindex="0">
				<div class="watch-sub-en">{{sub.en}}</div>
				<div class="watch-sub-vi" ng-if="sub.vi">{{sub.vi}}</div>
				<div class="watch-sub-meta">
					<span class="watch-time">{{fmtTime(sub.t)}}</span>
					<button type="button" class="quiz-speak" ng-class="{'is-on': loopIdx === $index}"
						ng-click="toggleLoop($event, $index)" ng-attr-title="{{loopIdx === $index ? 'Tắt lặp (×' + loopCount + ')' : 'Lặp dòng này'}}" aria-label="Loop line">
						<i class="fa fa-repeat" aria-hidden="true"></i>
					</button>
					<button type="button" class="quiz-speak" ng-if="!sub.vi" ng-click="showVi($event, sub)" title="Xem nghĩa Việt" aria-label="Nghĩa Việt">vi</button>
				</div>
			</div>
		</div>
	</div>
</section>
