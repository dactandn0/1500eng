<!DOCTYPE html>
<html>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
<!-- Text-to-Speech -->

<style type="text/css">
.my-1 { margin-top: 1rem;margin-bottom: 1rem }
</style>

<body>
<div ng-app="myApp" ng-controller="myCtrl"> 

    <div class="tab" ng-init="Tab=1">
      <button class="tablinks" ng-click="Tab=0">English</button>
      <button class="tablinks" ng-click="Tab=1">Dump</button>
      <button class="tablinks" ng-click="Tab=2">UE_CSV</button>
    </div>
    
      <div ng-show="Tab==0">
    	<p>Input something in [A]:</p>

    	<textarea ng-model="inputA" rows="25" cols="40" ng-trim="false"></textarea>
    	<textarea ng-model="inputB" rows="25" cols="40" ng-trim="false"></textarea>
    	<textarea ng-model="inputC" rows="25" cols="40" ng-trim="false"></textarea>

        <div class="my-1">
            Replace (regex) : <input type="text" ng-model="regexA" placeholder="From"> => <input type="text" ng-model="replaceBy" placeholder="To" ng-trim="false">
            <button ng-click="replaceRg()">B=A.Replace('From', 'To')</button>
            <button ng-click="synonyms()">B=A.synonyms</button>
            <button ng-click="boDauTiengViet()">A(ư á)->u a</button>
            <button ng-click="add_underscore()">a b->a_b</button>
            <button ng-click="add_underscore(false)">a_b->a b</button>
            <button ng-click="makeEngSenForApp()">makeEngSenForApp</button>
        </div>
    	
    	
    	<button ng-click="combineA_B()">C=A+B</button>

        <div class="my-1">
           <label for="cars">Box </label>
           <select ng-model="selectedBox">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>

            <button ng-click="boxAppendBr()">Append 'br' tag</button>     
        </div>

    	<span ng-repeat="x in records">{{x}}&nbsp;&nbsp;&nbsp;</ul>
     </div> <!--  tab0 -->

    <div ng-show="Tab==1">
        <textarea ng-model="inputA2" rows="5" cols="80" ng-trim="true" autofocus></textarea>
        <textarea ng-model="inputB2" rows="5" cols="80" ng-trim="true"></textarea>
        <textarea ng-model="inputC2" rows="5" cols="80" ng-trim="true"></textarea>
        <button ng-click="DumpText()" ng-disabled="bDumpTextDisabled">DumpText</button>
        <br><br>
        <input type="text" id="lengthVowel" cols="1" placeholder="Generate length">
        <button ng-click="genRdVowelTextByGroup()" >viVowelGen</button>

        <br><br>
        <label for="voiceSelect">Giọng: </label>
        <select id="voiceSelect"></select>
        <br><br>
        <label for="rateRange">Tốc độ đọc (0.5–1.5): </label>
        <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="1">
        <span id="rateValue">1.0</span>

        <br><br>

        <textarea id="text-input" rows="4" cols="50">Chào bạn, đây là ví dụ về chức năng Text-to-Speech.</textarea>
        <br><br>
        <button id="speak-button">Nghe</button>
        <button id="download-button">Tải về</button>
    </div>

    <div ng-show="Tab==2">
      <p>Input something in [A] [B] [C]:</p>

    <textarea ng-model="inputA3" rows="25" cols="40" ng-trim="false" placeholder="Plain Struct"></textarea>
    <textarea ng-model="inputB3" rows="25" cols="40" ng-trim="false" placeholder="Result"></textarea>
    <br>
    <button ng-click="PlainStruct()">PlainStruct</button>
    <button ng-click="SortAlpha()">SortAlpha</button>
    <button ng-click="MakeStruct()">MakeStruct</button>
  </div> <!-- tab3 -->



</div> <!-- controller -->
</body>
</html>

<script>
var app = angular.module('myApp', []);
app.controller('myCtrl', function($scope, $http) 
{
    $scope.MakeStruct = function()
    {
      const structName = "StructName"
        const lines = $scope.inputA3.split("\n").map(l => l.trim()).filter(l => l.length > 0);

    const category = `${structName}`;

    let props = lines.map(line => {
      // Xóa comment
      let noComment = line.split("//")[0].trim();
      // Xóa dấu phẩy hoặc ; cuối
      noComment = noComment.replace(/[,;]+$/, "");
      // Tách type + name
      const parts = noComment.split(/\s+/);
      const name = parts.pop();
      const type = parts.join(" ");
      return `\tUPROPERTY(EditAnywhere, BlueprintReadWrite, Category="${category}", meta=(DisplayName="${name}"))\n\t${type} ${name};\n`;
    }).join("\n");


  var result = `USTRUCT(BlueprintType)\nstruct ${structName}\n{\n\tGENERATED_BODY()\n\n${props}};`;
  $scope.inputB3 = result;
    copyToClipboard(result)
    }

    $scope.SortAlpha = function()
    {
      var lines = $scope.inputA3;
      let arr = lines.split("\n");

    // Sort theo key trước dấu phẩy
    arr.sort((a, b) => {
      let keyA = a.split(",")[0].toLowerCase();
      let keyB = b.split(",")[0].toLowerCase();
      return keyA.localeCompare(keyB);
    });

    // Ghép lại thành chuỗi
    let result = arr.join("\n");
    $scope.inputB3 = result;
    copyToClipboard(result)

    }
    $scope.PlainStruct = function()
    {
      var input = $scope.inputA3;
    // Lấy phần struct ... { ... }
      const structMatch = input.match(/struct\s+(\w+)\s*\{([\s\S]*?)\}/);
      if (!structMatch) return "";

      const structName = structMatch[1];
      const body = structMatch[2];

      // Tách các dòng có dạng kiểu + tên biến
      const lines = body.split("\n")
        .map(l => l.trim())
        .filter(l => l && !l.startsWith("UPROPERTY") && !l.startsWith("GENERATED_BODY"));

      // Giữ lại phần khai báo kiểu + tên
      const cleaned = lines.map(l => {
        // loại bỏ dấu ; thừa + category
        return l.replace(/;.*$/, ";");
      });

      cleaned[0] = "\n" + cleaned[0];

      var result =  `struct ${structName}\n{${cleaned.join("\n")}\n}`;
      $scope.inputB3 = result;
      copyToClipboard(result)
    }

    var vowelGroups = [
      ["a","á","à","ả","ã","ạ"],
      ["e","é","è","ẻ","ẽ","ẹ"],
      ["i","í","ì","ỉ","ĩ","ị"],
      ["o","ó","ò","ỏ","õ","ọ"],
      ["u","ú","ù","ủ","ũ","ụ"],
      ["ê","ế","ề","ể","ễ","ệ"],
      ["â","ấ","ầ","ẩ","ẫ","ậ"],
      ["ă","ắ","ằ","ẳ","ẵ","ặ"],
      ["ư","ứ","ừ","ử","ữ","ự"],
      ["ơ","ớ","ờ","ở","ỡ","ợ"]
    ];

    let synth = window.speechSynthesis;
    const speakButton = document.getElementById('speak-button');
    const downloadButton = document.getElementById('download-button');
    const textInput = document.getElementById('text-input');
    const rateRange = document.getElementById("rateRange");
    const rateValue = document.getElementById("rateValue");
    const voiceSelect = document.getElementById("voiceSelect");

    function populateVoices() {
      voices = speechSynthesis.getVoices();

      // Xóa giọng cũ trong select
      if (voiceSelect)
       voiceSelect.innerHTML = "";

      voices.forEach((voice, i) => {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = `${voice.name} (${voice.lang})${voice.default ? " [default]" : ""}`;
        if (voiceSelect) voiceSelect.appendChild(option);
      });

      // load voice đã lưu trong localStorage
      const savedVoiceIndex = localStorage.getItem("selectedVoiceIndex");
      if (voiceSelect && savedVoiceIndex !== null && voices[savedVoiceIndex]) {
        voiceSelect.value = savedVoiceIndex;
      }
    }
    // Một số browser (như Chrome) load voices async
    speechSynthesis.onvoiceschanged = populateVoices;
    populateVoices();

    if (rateRange)
    rateRange.addEventListener("input", () => {
      rateValue.textContent = rateRange.value;
    });

  function speakText(downloadMode = false) {
  if (synth.speaking) synth.cancel();

  const text = textInput.value;
  if (!text) return;

  currentUtterance = new SpeechSynthesisUtterance(text);
  currentUtterance.voice = voices[document.getElementById("voiceSelect").value];

  // Nếu bấm download thì bật recorder
  if (downloadMode) {
        alert("Cannot")
  }

  synth.speak(currentUtterance);
}


     // Hàm tải văn bản dưới dạng tệp âm thanh
    function downloadAudio(text) {
      const audio = new Audio();
      audio.src = URL.createObjectURL(new Blob([text], { type: 'audio/wav' }));
      audio.play();

      // Tạo liên kết tải về
      const link = document.createElement('a');
      link.href = audio.src;
      link.download = 'audio.wav';
      link.click();
    }

    if (speakButton) speakButton.addEventListener("click", () => speakText(false));

    if (downloadButton) downloadButton.addEventListener("click", () => speakText(true));

    if (voiceSelect)
    voiceSelect.addEventListener("change", () => {
      localStorage.setItem("selectedVoiceIndex", voiceSelect.value);
    });

    // Hàm pick 1 nhóm 3–4 ký tự từ dòng, với trọng số cho dòng ưu tiên
    function pickGroupFromLineWeighted(vowelGroups) {
      const weightedIndices = [
        0,0,0,  // dòng 0 → tăng xác suất
        1,
        2,
        3,3,3,  // dòng 3 → tăng xác suất
        4,
        5,
        6,6,6,  // dòng 6 → tăng xác suất
        7,7,7,  // dòng 7 → tăng xác suất
        8,8,8,  // dòng 8 → tăng xác suất
        9,9,9   // dòng 9 → tăng xác suất
      ];

      const randomLineIndex = weightedIndices[Math.floor(Math.random() * weightedIndices.length)];
      const line = vowelGroups[randomLineIndex];

      const groupSize = Math.floor(Math.random() * (6 - 3 + 1)) + 3;  // [3,6]
      if (line.length <= groupSize) return line.join(" ");

      const startIndex = Math.floor(Math.random() * (line.length - groupSize + 1));
      return line.slice(startIndex, startIndex + groupSize).join(" ");
    }

    // Hàm tạo chuỗi cuối với dấu câu
    $scope.genRdVowelTextByGroup = function () {
      let result = "";
      let length = document.getElementById("lengthVowel").value || 60;
      while (result.length < length) {
        const group = pickGroupFromLineWeighted(vowelGroups);
        const punctuation = Math.random() < 0.75 ? "," : ".";
        result += group + punctuation + " ";
      }
      
       result = result.slice(0, length);
       document.getElementById("text-input").textContent = result;
       copyToClipboard(result);
    }

    // - dump
    $scope.bDumpTextDisabled = false
    $scope.DumpText = function()
    {
        $scope.bDumpTextDisabled = true
        const url = "https://dummyjson.com/quotes/random?limit=3"
        $http.get(url)
        .then(function(response) {
            $scope.inputA2 = response.data.quote;

            var urlTransVI = "https://api.mymemory.translated.net/get?q=" +  $scope.inputA2 + "&langpair=en|vi"
            $http.get(urlTransVI)
            .then(function(res){
               $scope.inputB2  = res.data.responseData.translatedText;

             var urlTransChina = "https://api.mymemory.translated.net/get?q=" +  $scope.inputA2 + "&langpair=en|zh-CN"
                $http.get(urlTransChina)
                .then(function(res){
                   $scope.inputC2  = res.data.responseData.translatedText;

                   copyToClipboard("KEY_1," +  $scope.inputA2 + "," + $scope.inputB2 )

                }, function(err){
                   $scope.inputC2  = "Error translating!";
                });


               copyToClipboard("KEY_1," +  $scope.inputA2 + "," + $scope.inputB2 )
               $scope.bDumpTextDisabled = false;

            }, function(err){
               $scope.inputB2  = "Error translating!";
               $scope.bDumpTextDisabled = false;
            });


            }, function(error) {
              $scope.inputA2 = "Error fetching lorem ipsum!";
              $scope.bDumpTextDisabled = false;
            });

    };


   // $scope.DumpText();


    // -- english
    const KBr = '<br>\\\n'
    $scope.selectedBox = "C"
	$scope.boxAppendBr = function()
    {
    	let result = ''

        let inputBox = $scope.inputC
        if ($scope.selectedBox=='A') inputBox = $scope.inputA
        else if ($scope.selectedBox=='B') inputBox = $scope.inputB

        if (!inputBox) return
        else inputBox = inputBox.replace(/(<br>\\)/gm, '').trim()

    	let splBox = inputBox.split('\n')
    	for (var i = 0; i < splBox.length; i++) 
    	{
    		const ele = splBox[i]
    		result += ele + KBr
    	}
        if ($scope.selectedBox==='A')  $scope.inputA = result
        else if ($scope.selectedBox==='B')  $scope.inputB = result
    	else $scope.inputC = result

    	saveAll() 
    }

    $scope.combineA_B = function()
    {
    	let resultA_B = ''
    	let splA = $scope.inputA.split('\n')
    	let splB = $scope.inputB.split('\n')
    	for (var i = 0; i < splA.length; i++) 
    	{
    		const eleA = splA[i]
    		let eleB = splB[i] || ''
    		resultA_B += eleA + eleB + '\n'
    	}
    	$scope.inputC = resultA_B

    	saveAll()
    }

    $scope.replaceRg = function()
    {   
    	let rgA =  new RegExp ($scope.regexA, 'gi')
    	let reBy = $scope.replaceBy || ''

    	$scope.inputB = $scope.inputA.replace(rgA, reBy)

    	saveAll()
    }

    // tiktok ebook
    $scope.makeEngSenForApp = function()
    {
       let text = $scope.inputA;
       const lines = text
        .split('\n')
        .map(l => l.trim())
        .filter(Boolean);

      // line đầu tiên = title
      const title = lines[0];

      // lấy unit từ "PASSAGE X"
      const unitMatch = title.match(/PASSAGE\s+(\d+)/i);
      const unit = unitMatch ? Number(unitMatch[1]) : null;

      // các dòng nội dung (a. b. c. ...)
      const en = lines
        .slice(1)
        .join('<br>\\n');

      $scope.inputB = `{
          unit: ${unit},
          title: "${title}",
          en: "${en}"
        }`;

      copyToClipboard($scope.inputB)
    }

    $scope.add_underscore = function(add=true)
    {   
        let input = ''
        if (add)
        {
            input = $scope.inputA.replace(/[\,\-&\.]/gi, ' ').replace(/\s+/gi, '_')
        }
        else
            input = $scope.inputA.replace(/[_]/gi, ' ')

    	$scope.inputB = input
    	saveAll()
      copyToClipboard(input)
    }

    $scope.boDauTiengViet = function()
    {
    	$scope.inputB = removeAccents($scope.inputA)
      copyToClipboard($scope.inputB)
    	saveAll()
    }

    $scope.synonyms = function()
    {   
        let splA = $scope.inputA.split(' ')
        let r = '{\n'
        let _words = 'words: "'
        for (var i = 0; i < splA.length; i++) {
           var ele = splA[i]
           _words += ele
           if ( i < splA.length - 1 ) _words += ' | '
        }
        r += _words + ' "\n' + ', type:""' + '\n' + ', mean: "" ' + '\n}'

        $scope.inputB = r
        saveAll()
    }



 $scope.records = [
        "\\d",
        "adj\\.",
        "n\\.",
        "v\\.",
    ]

// Copies text to clipboard
function copyToClipboard(text) {
  navigator.clipboard.writeText(text)
    .then(() => {
      console.log('Copied to clipboard successfully!');
    })
    .catch(err => {
      console.error('Failed to copy: ', err);
    });
}

function saveDB(key,val )
{
	localStorage.setItem(key, val);
}

function removeAccents(str) {
  var AccentsMap = [
    "aàảãáạăằẳẵắặâầẩẫấậ",
    "AÀẢÃÁẠĂẰẲẴẮẶÂẦẨẪẤẬ",
    "dđ", "DĐ",
    "eèẻẽéẹêềểễếệ",
    "EÈẺẼÉẸÊỀỂỄẾỆ",
    "iìỉĩíị",
    "IÌỈĨÍỊ",
    "oòỏõóọôồổỗốộơờởỡớợ",
    "OÒỎÕÓỌÔỒỔỖỐỘƠỜỞỠỚỢ",
    "uùủũúụưừửữứự",
    "UÙỦŨÚỤƯỪỬỮỨỰ",
    "yỳỷỹýỵ",
    "YỲỶỸÝỴ"    
  ];
  for (var i=0; i<AccentsMap.length; i++) {
    var re = new RegExp('[' + AccentsMap[i].substr(1) + ']', 'g');
    var char = AccentsMap[i][0];
    str = str.replace(re, char);
  }
  return str;
}


function loadData()
{
    if (localStorage.hasOwnProperty('inputA')) 
        $scope.inputA = localStorage['inputA'].trim()
    if (localStorage.hasOwnProperty('inputB')) 
        $scope.inputB = localStorage['inputB'].trim()
    if (localStorage.hasOwnProperty('inputC')) 
        $scope.inputC = localStorage['inputC'].trim()
}

function saveAll()
{
	saveDB('inputA', $scope.inputA)
    saveDB('inputB', $scope.inputB)
    saveDB('inputC', $scope.inputC)
}
function saveC() 
{
	saveDB('inputC', $scope.inputC)
}


loadData();

});
</script>
