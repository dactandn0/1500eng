<section class="study-shell quiz-page">
	<div ng-include="'./includes/studyHeader.html'"
		ng-init="studyEyebrow='LISTENING LAB'; studyTitle='Listen with Subtitle'; studyDescription='Xem video/Audio, phụ đề chạy theo, chạm dòng để nhảy tới.'; studyStatus='TRY HARD'">
	</div>
	<div class="copy-toast" ng-show="copyToastMsg">{{copyToastMsg}}</div>

	<style>
		/* toast rieng nut Copy: top-center (iPhone/man hep), tu thay the + tu tat sau 2.5s */
		.copy-toast {
			position: fixed;
			top: 12px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 1099999;
			background: rgba(43, 40, 31, .94);
			color: #fff8e1;
			padding: .55rem 1rem;
			border-radius: 10px;
			font-size: .85rem;
			border: 1px solid #e6c96c;
			box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
			max-width: 92vw;
			text-align: center;
		}

		.watch-video-wrap {
			background: #000;
			border-radius: 12px;
			overflow: hidden;
			margin-bottom: .8rem;
		}

		.watch-video-wrap video {
			width: 100%;
			max-height: 52vh;
			display: block;
			background: #000;
		}

		.watch-yt-wrap {
			position: relative;
			width: 100%;
			padding-bottom: 56.25%;
			background: #000;
			border-radius: 12px;
			overflow: hidden;
			margin-bottom: .8rem;
		}

		.watch-yt-wrap #watchYt {
			position: absolute;
			inset: 0;
		}

		.watch-yt-wrap #watchYt iframe {
			width: 100%;
			height: 100%;
		}

		.watch-row {
			display: flex;
			flex-wrap: wrap;
			gap: .4rem;
			margin-bottom: .8rem;
			align-items: center;
		}

		/* cum 3 nut can phai cho thuan ngon tay phai */
		.watch-row-btns {
			display: flex;
			gap: .4rem;
			margin-left: auto;
			align-items: center;
		}

		/* thanh AutoFollow/ShowScript + cau dang chay: thuong o vi tri cu (opa 1),
		   cuon xuong -> dock day man hinh (opa .7) */
		.watch-row-sticky {
			opacity: 1;
			transition: opacity .25s ease;
		}

		.watch-row-sticky.is-docked {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			z-index: 40;
			max-width: 980px;
			margin: 0 auto;
			padding: .4rem .8rem;
			background: #fffdf7;
			border: 1px solid #eee5c9;
			border-bottom: none;
			border-radius: 10px 10px 0 0;
			opacity: 1.0;
		}

		/* gon header rieng trang Listen (khong anh huong module khac) */
		.quiz-page .study-header {
			padding: .5rem .8rem;
			border-radius: 10px;
			gap: .8rem;
		}

		.quiz-page .study-header h1 {
			font-size: 1.05rem;
			margin-top: .15rem;
		}

		.quiz-page .study-header p {
			display: none;
		}

		.quiz-page .eyebrow {
			font-size: .62rem;
		}

		.quiz-page .study-status {
			padding: .25rem .55rem;
			font-size: .68rem;
		}

		/* iPhone/hep: header chi hien eyebrow */
		@media (max-width: 640px) {
			.quiz-page .study-header {
				padding: .3rem .6rem;
				border-radius: 8px;
			}

			.quiz-page .study-header h1,
			.quiz-page .study-status {
				display: none;
			}
		}

		.watch-subs {
			max-height: 65vh;
			overflow-y: auto;
			padding: .4rem;
			background: #fffdf7;
			border: 1px solid #eee5c9;
			border-radius: 5px;
			-webkit-overflow-scrolling: touch;
		}

		.watch-sub {
			padding: .55rem .7rem;
			border-radius: 10px;
			border: 1px solid transparent;
		}

		.watch-sub-top {
			display: flex;
			gap: .5rem;
			align-items: flex-start;
		}

		.watch-sub-main {
			flex: 1;
			min-width: 0;
		}

		.watch-sub-actions {
			display: flex;
			flex-direction: row;
			gap: .35rem;
			flex-shrink: 0;
		}

		.watch-script {
			max-height: 46vh;
			overflow-y: auto;
			padding: .8rem 1rem;
			background: #fffdf7;
			border: 1px solid #eee5c9;
			border-radius: 12px;
			white-space: pre-line;
			font-size: .9rem;
			line-height: 1.75;
			color: #3d4c59;
			-webkit-overflow-scrolling: touch;
		}

		.watch-sub.is-active {
			background: #f5f5f5;
			border-color: #e6c96c;
		}

		.watch-sub-en {
			font-size: .95rem;
			color: #3d4c59;
			cursor: pointer;
		}

		.watch-sub.is-active .watch-sub-en {
			color: #5f470c;
			font-weight: 500;
		}

		.watch-sub-vi {
			font-size: .82rem;
			color: #8b857b;
			margin-top: .15rem;
		}

		.watch-note {
			max-height: 0;
			overflow: hidden;
			opacity: 0;
			transition: max-height .35s ease, opacity .3s ease, margin .3s ease;
			margin: 0;
			padding: 0 .6rem;
			font-size: .85rem;
			line-height: 1.7;
			color: #5f470c;
			background: #fff8e1;
			border-radius: 8px;
			white-space: pre-line;
		}

		.watch-note.open {
			max-height: 340px;
			opacity: 1;
			margin-top: .45rem;
			padding: .55rem .6rem;
			overflow-y: auto;
			border: 1px solid #f1e8d0;
			-webkit-overflow-scrolling: touch;
		}

		.watch-sub-meta {
			display: flex;
			align-items: center;
			gap: .5rem;
			margin-top: .25rem;
		}

		.watch-time {
			font-size: .72rem;
			color: #23639a;
			background: #edf6ff;
			border: 1px solid #cfe3f6;
			border-radius: 999px;
			padding: .1rem .5rem;
		}

		.watch-toggle {
			padding: .4rem .7rem;
			border-radius: 999px;
			border: 1px solid #eee5c9;
			background: #fffdf7;
			color: #756d61;
			font-size: .8rem;
		}

		.watch-toggle.is-on {
			background: linear-gradient(135deg, #fff4c9 0%, #ffe9a2 100%);
			border-color: #e6c96c;
			color: #604a0e;
		}

		.watch-now {
			flex: 1;
			min-width: 0;
			font-size: .85rem;
			color: #5f470c;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.watch-now.watch-anim {
			animation: watchNowIn 1.45s ease;
		}

		@keyframes watchNowIn {
			from {
				opacity: .15;
			}

			to {
				opacity: 1;
			}
		}

		.watch-sub {
			transition: background-color .4s ease, border-color .4s ease;
		}

		.watch-sub-en {
			transition: color .4s ease;
		}

		/*.watch-sub.row-anim { animation: rowFlash .5s ease; }*/
		@keyframes rowFlash {
			0% {
				background-color: #ffe9a2;
			}

			100% {
				background-color: transparent;
			}
		}

		.quiz-speak.is-on {
			background: #e7f7ee !important;
			border-color: #bfe6cf !important;
			color: #1e7e46 !important;
		}

		.star-btn.is-on {
			background: #fff4c9 !important;
			border-color: #e6c96c !important;
		}

		.star-btn.is-on .fa {
			color: #e6a200 !important;
		}

		.lesson-drop {
			position: absolute;
			top: 100%;
			left: 0;
			right: 0;
			z-index: 50;
			max-height: 240px;
			overflow-y: auto;
			background: #fffdf7;
			border: 1px solid #eee5c9;
			border-radius: 10px;
			margin-top: .25rem;
			box-shadow: 0 8px 20px rgba(191, 151, 45, .18);
			-webkit-overflow-scrolling: touch;
		}

		.lesson-drop-item {
			padding: .55rem .8rem;
			font-size: .9rem;
			color: #3d4c59;
			cursor: pointer;
		}

		.lesson-drop-item.is-active {
			background: #fff0b8;
			color: #5f470c;
			font-weight: 700;
		}

		.lesson-drop-item.is-hover {
			background: #fff0b8;
		}

		.lesson-drop-item.is-empty {
			color: #8b857b;
			font-style: italic;
			cursor: default;
		}
	</style>

	<div class="quiz-type-row my-2">
		<div style="flex:1; position:relative;">
			<input class="setting-select" style="width:100%;" ng-model="lessonSearch"
				ng-focus="lessonDropOpen = true; lessonActive = 0" ng-blur="closeLessonDrop()"
				ng-change="lessonDropOpen = true; lessonActive = 0" ng-keydown="lessonKey($event)"
				ng-click="selectAllLesson($event)" placeholder="Tìm bài..." aria-label="Tim bai" autocomplete="off">
			<div class="lesson-drop" ng-show="lessonDropOpen">
				<div class="lesson-drop-item"
					ng-class="{'is-active': c.i === lessonIdx, 'is-hover': $index === lessonActive}"
					ng-repeat="c in filteredLessons() track by c.i" ng-mousedown="pickLesson(c)">{{c.title}}</div>
				<div class="lesson-drop-item is-empty" ng-if="!filteredLessons().length">Không thấy bài nào</div>
			</div>
		</div>
	</div>

	<div ng-if="!lesson">
		<p style="color:#8b857b;">Chưa có bài nào. Thêm vào <code>LISTEN_DATA</code> trong
			<code>listensrt/listensrtData.js</code> (dùng <code>listensrt/srt2js.py</code> để chuyển .srt).
		</p>
	</div>

	<div ng-if="lesson">
		<div class="watch-video-wrap" ng-if="lesson.type !== 'youtube' && !isAudio">
			<video id="watchVideo" controls playsinline preload="metadata"></video>
		</div>
		<div class="quiz-feedback is-bad" ng-if="videoErr">{{videoErr}}</div>
		<div class="watch-yt-wrap" ng-if="lesson.type === 'youtube'">
			<div id="watchYt"></div>
		</div>
		<div class="watch-row watch-row-sticky">
			<audio id="watchAudio" ng-if="lesson.type !== 'youtube' && isAudio" controls preload="metadata"
				style="flex:1 1 100%;">
			</audio>
			<span class="ml-1 watch-now" ng-if="lesson && lesson.subs[curIdx]">▶ {{lesson.subs[curIdx].en}}</span>
			<div class="watch-row-btns">
				<button type="button" class="watch-toggle" ng-click="copySubs($event)"
					title="Copy sub: full -> từng cụm -> full" aria-label="Copy subtitles">
					<i class="fa fa-copy" aria-hidden="true"></i>&nbsp;Copy {{copyLabel()}}
				</button>
				<button type="button" class="watch-toggle" ng-class="{'is-on': showScript}" ng-click="toggleScript()"
					ng-if="lessonNotes" title="Show script" aria-label="Show script">
					<i class="fa fa-file-text-o" aria-hidden="true"></i>
				</button>

				<button type="button" class="watch-toggle" ng-class="{'is-on': follow}" ng-click="toggleFollow()"
					title="Auto follow" aria-label="Auto follow">
					<i class="fa fa-magnet" aria-hidden="true"></i>
				</button>
			</div>
		</div>

		<div class="watch-script" ng-if="showScript && lessonNotes !== ''">{{lessonNotes}}</div>
		<div class="watch-subs" ng-show="!showScript">
			<div class="watch-sub" id="wsub{{$index}}" ng-class="{'is-active': $index === curIdx}"
				ng-repeat="sub in lesson.subs track by $index" ng-click="seekSub(sub, $event)" role="button"
				tabindex="0">
				<div class="watch-sub-top">
					<div class="watch-sub-main">
						<div class="watch-sub-en">{{sub.en}}</div>
						<div class="watch-sub-vi" ng-if="sub.vi">{{$index+1}}. {{sub.vi}}</div>
						<div class="watch-sub-meta">
							<span class="watch-time">{{fmtTime(sub.t)}}</span>
						</div>
					</div>
					<div class="watch-sub-actions">
						<button type="button" class="quiz-speak" ng-class="{'is-on': loopIdx === $index}"
							ng-click="toggleLoop($event, $index)"
							ng-attr-title="{{loopIdx === $index ? 'Tắt lặp (×' + loopCount + ')' : 'Lặp dòng này'}}"
							aria-label="Loop line">
							<i class="fa fa-repeat" aria-hidden="true"></i>
						</button>
						<button type="button" class="quiz-speak" ng-if="!sub.vi" ng-click="showVi($event, sub)"
							title="Xem nghĩa Việt" aria-label="Nghĩa Việt">vi</button>
						<button type="button" class="quiz-speak" ng-class="{'is-on': openNoteIdx === $index}"
							ng-if="sub.note" ng-click="toggleNote($event, $index)" title="Xem note"
							aria-label="Note"><span class="fa fa-file-text-o" aria-hidden="true"></span></button>
						<!-- [Note] -->
						<button type="button" class="quiz-speak star-btn" ng-class="{'is-on': isStarred($index)}"
							ng-click="toggleStar($event, $index)" title="Lưu dòng này" aria-label="Save line">
							<i class="fa" ng-class="isStarred($index) ? 'fa-star' : 'fa-star-o'" aria-hidden="true"></i>
						</button>
					</div>
				</div>
				<div class="watch-note" ng-class="{'open': openNoteIdx === $index}" ng-if="sub.note">{{sub.note}}</div>
			</div>
		</div>
	</div>
</section>
